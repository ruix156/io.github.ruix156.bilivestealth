name: Release APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 可选: 配置正式签名。在仓库 Settings -> Secrets -> Actions 添加:
      #   SIGNING_KEYSTORE_BASE64 : keystore.jks 的 base64 (base64 -w0 keystore.jks)
      #   SIGNING_STORE_PASSWORD  : keystore 密码
      #   SIGNING_KEY_ALIAS       : key 别名
      #   SIGNING_KEY_PASSWORD    : key 密码
      # 未配置时回退为 debug 签名 (仅适合测试, 正式发布请务必配置,
      # 否则每次构建签名不同, 用户无法覆盖安装更新)。
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          else
            echo "::warning::未配置签名 secrets, 将使用 debug 签名。"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiLiveStealth
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
